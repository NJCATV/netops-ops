# 旧版网管过渡入口；旧版静态资源已复制到 /2025/ 下。
location = /2025 {
    return 302 /2025/;
}

location ^~ /2025/ {
    try_files $uri $uri/ /2025/index.html;
}

# 原 AIOps 完整页面继续保留，不受 /2026/ 兼容重定向影响。
location ^~ /2026/legacy-aiops/ {
    try_files $uri $uri/ /2026/legacy-aiops/index.html;
}

# 新版已成为根入口；原 /2026/ 链接统一回到新版首页。
location = /2026 {
    return 301 /;
}

location ^~ /2026/ {
    return 301 /;
}
